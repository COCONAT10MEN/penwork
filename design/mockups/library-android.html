<!doctype html>
<html lang="en">
<head>
<!-- Static mockup exported from the Penwork design canvas. Visual reference only: real colors come from src/theme tokens. -->
<meta charset="utf-8">
<title>Android library</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..900&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3F5BD4}a:hover{color:#1A2F9E}
button,input{font-family:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; color: #1B1B21; background: #FBF8FF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="flex: 1; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 6px 0 18px; background: #E9E7EF; border-radius: 999px; color: #45464F">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
      <input type="search" placeholder="Search notes and PDFs" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: #1B1B21">
      <button type="button" aria-label="Account" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #FFD7F1; color: #6E3864; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 20c1-4 4-6 8-6s7 2 8 6z"></path></svg></button>
    </label>

    <h1 style="margin: 4px 0 0; font-size: 36px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Good evening</h1>

    <div role="group" aria-label="Filter" style="display: flex; gap: 8px">
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 8px; background: #DFE1F9; color: #2B2E42; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>All</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border: 1px solid #767680; border-radius: 8px; background: transparent; color: #45464F; font-size: 14px; font-weight: 600">Notebooks</button>
      <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border: 1px solid #767680; border-radius: 8px; background: transparent; color: #45464F; font-size: 14px; font-weight: 600">PDFs</button>
    </div>

    <a href="#lib" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 28px; background: #DDE1FF; color: #1A2F9E; text-decoration: none">
      <div style="height: 120px; border-radius: 18px; background-color: #FFFFFF; background-image: radial-gradient(#D7D8E4 1.1px, transparent 1.1px); background-size: 16px 16px; padding: 14px 16px; box-sizing: border-box; font-family: Caveat, cursive; color: #1F2A44; overflow: hidden">
        <div style="font-size: 26px; font-weight: 700; line-height: 1">Week 4 · Waves</div>
        <div style="font-size: 19px">• carries energy, not matter</div>
        <div style="font-size: 19px">• v = f × λ</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Continue</div>
          <div style="font-size: 19px; font-weight: 800; color: #1B1B21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lecture notes — Week 4</div>
        </div>
        <span style="flex: none; display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #3F5BD4; color: #FFFFFF; font-size: 15px; font-weight: 700">Resume</span>
      </div>
    </a>

    <h2 style="margin: 0; font-size: 18px; font-weight: 700">Recent</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="#lib" style="display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 12px; border-radius: 24px; background: #EFEDF4; color: #1B1B21; text-decoration: none">
        <div style="height: 88px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><div style="width: 60px; height: 76px; border: 1px solid #C6C5D0; border-bottom: 0; border-radius: 4px 4px 0 0; padding: 8px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px"><span style="height: 3px; width: 80%; background: #C6C5D0"></span><span style="height: 6px; width: 100%; background: #FBE38A"></span><span style="height: 3px; width: 70%; background: #C6C5D0"></span></div></div>
        <div style="padding: 0 6px"><div style="font-size: 14px; font-weight: 700">Scanned contract</div><div style="font-size: 12px; color: #45464F">PDF · today</div></div>
      </a>
      <a href="#lib" style="display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 12px; border-radius: 24px; background: #EFEDF4; color: #1B1B21; text-decoration: none">
        <div style="height: 88px; border-radius: 16px; background: #FFFFFF; padding: 10px 12px; box-sizing: border-box; font-family: Caveat, cursive; font-size: 19px; color: #1F2A44; overflow: hidden">Lab ideas — try the ripple tank</div>
        <div style="padding: 0 6px"><div style="font-size: 14px; font-weight: 700">Lab ideas</div><div style="font-size: 12px; color: #45464F">Notebook · Mon</div></div>
      </a>
    </div>
  </div>

  <button type="button" aria-label="New notebook" style="position: absolute; right: 16px; bottom: 96px; width: 80px; height: 80px; border: 0; border-radius: 24px; background: #3F5BD4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(63,91,212,0.35)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l3-1 11-11-2-2L5 17z"></path><path d="M14 6l2 2"></path></svg></button>

  <nav aria-label="Main" style="display: flex; height: 80px; background: #F5F2FA; padding: 0 8px">
    <a href="#lib" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #2B2E42; font-size: 12px; font-weight: 800"><span style="width: 56px; height: 32px; border-radius: 16px; background: #DFE1F9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path></svg></span>Library</a>
    <a href="#lib" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #45464F; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 15c2-3 3 1 5-2s2 1 3 0"></path></svg></span>Notebooks</a>
    <a href="#lib" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #45464F; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path><path d="M9 17v-5h1.6a1.6 1.6 0 0 1 0 3.2H9"></path></svg></span>PDFs</a>
    <a href="#lib" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #45464F; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg></span>Favorites</a>
  </nav>
</div>
</body>
</html>
