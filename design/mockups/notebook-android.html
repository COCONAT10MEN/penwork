<!doctype html>
<html lang="en">
<head>
<!-- Static mockup exported from the Penwork design canvas. Visual reference only: real colors come from src/theme tokens. -->
<meta charset="utf-8">
<title>Android notebook</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..900&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3F5BD4}a:hover{color:#1A2F9E}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; color: #1B1B21; background: #EFEDF4; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 2px; height: 64px; padding: 0 4px; background: #FBF8FF">
    <button type="button" aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #45464F; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lecture notes — Week 4</div>
      <div style="font-size: 12px; color: #45464F">Page 3 of 12 · synced</div>
    </div>
    <button type="button" aria-label="Pages" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #45464F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="2"></rect><rect x="13" y="4" width="7" height="9" rx="2"></rect><rect x="4" y="15" width="7" height="5" rx="2"></rect><rect x="13" y="15" width="7" height="5" rx="2"></rect></svg></button>
    <button type="button" aria-label="More options" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #45464F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
  </header>

  <main style="flex: 1; padding: 12px; box-sizing: border-box; position: relative">
    <div style="height: 100%; background-color: #FFFFFF; background-image: radial-gradient(#D7D8E4 1.1px, transparent 1.1px); background-size: 20px 20px; border-radius: 20px; padding: 26px 22px; box-sizing: border-box; font-family: Caveat, cursive; color: #1F2A44">
      <div style="font-size: 36px; font-weight: 700; line-height: 1">Week 4 · Waves</div>
      <svg width="200" height="12" viewBox="0 0 200 12" fill="none" aria-hidden="true"><path d="M3 8c35-5 75-6 115-3s60 2 79-1" stroke="#3F5BD4" stroke-width="3" stroke-linecap="round"></path></svg>
      <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 24px; line-height: 1.2">
        <div>• Carries <span style="background: rgba(251, 214, 74, 0.55); padding: 0 5px; border-radius: 4px">energy, not matter</span></div>
        <div>• v = f × λ</div>
        <div>• Transverse vs longitudinal</div>
      </div>
      <svg width="300" height="110" viewBox="0 0 300 110" fill="none" role="img" aria-label="Hand-drawn sine wave" style="display: block; margin-top: 18px">
        <path d="M8 55c18-46 40-46 58 0s40 46 58 0 40-46 58 0 40 46 58 0 30-36 44-22" stroke="#16181D" stroke-width="3" stroke-linecap="round"></path>
        <path d="M8 55h282" stroke="#9A9BA8" stroke-width="1.5" stroke-dasharray="5 6"></path>
      </svg>
      <div style="margin-top: 22px; transform: rotate(-3deg); background: #FFD7F1; padding: 12px 14px; width: 170px; border-radius: 4px 18px 18px 18px; font-size: 22px; line-height: 1.1; color: #4A1F42">Quiz on Thursday!</div>
    </div>

    <div style="position: absolute; left: 12px; right: 12px; bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 10px">
      <div role="toolbar" aria-label="Ink tools" style="display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 999px; background: #DDE1FF; box-shadow: 0 4px 14px rgba(27,27,33,0.16)">
        <button type="button" aria-label="Pen" aria-pressed="true" style="width: 52px; height: 52px; border: 0; border-radius: 50%; background: #3F5BD4; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l3-1 11-11-2-2L5 17z"></path></svg></button>
        <button type="button" aria-label="Highlighter" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: #1A2F9E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l6-10 4 3-7 9z"></path><path d="M9 14l-2 4h4l1-2"></path></svg></button>
        <button type="button" aria-label="Eraser" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: #1A2F9E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20l-4-4L14 6l6 6-8 8z"></path></svg></button>
        <button type="button" aria-label="Lasso select" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: #1A2F9E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18c-3-1-4-4-3-7 2-5 10-7 14-4s1 9-6 9c-2 0-3 1-3 2s1 2 2 2"></path></svg></button>
        <button type="button" aria-label="Ink color: black" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #16181D; box-shadow: 0 0 0 2px #DDE1FF, 0 0 0 4px #1A2F9E"></span></button>
      </div>
      <button type="button" aria-label="Undo" style="width: 64px; height: 64px; border: 0; border-radius: 20px; background: #FFD7F1; color: #6E3864; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(27,27,33,0.16)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
    </div>
  </main>
</div>
</body>
</html>
