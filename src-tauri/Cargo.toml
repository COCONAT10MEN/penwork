[package]
name = "penwork"
version = "0.1.0"
description = "Penwork: PDF reader/annotator and notebook app"
authors = ["COCONAT10MEN"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "penwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }

# Same version Tauri already uses, so this adds no new download. Only for the accent color.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_ViewManagement", "Foundation"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
